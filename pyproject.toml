[project]
name = "golfequipmentwebscraper"
version = "0.1.0"
description = "Tracks golf club prices across retailer sites into a queryable SQLite price history"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.5.5",
    "requests>=2.34.2",
]

[project.scripts]
scrape = "club_price_tracker.scrape:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["club_price_tracker"]
